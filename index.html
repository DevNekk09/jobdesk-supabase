<!doctype html><html lang="en"><head>
<meta name="referrer" content="no-referrer"/><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f332b">
<link rel="dns-prefetch" href="//vsvlutqagtkdtrowaked.supabase.co">
<link rel="preconnect" href="https://vsvlutqagtkdtrowaked.supabase.co" crossorigin>
<title>Jobdesk · Shared Team Workspace</title>
<link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg?v=211"/>
<style>
html,body{background:#f3f6f4;margin:0;min-height:100%;color:#20362a;font-family:Inter,"Segoe UI",Arial,sans-serif}
#root{min-height:100dvh}
.boot-failure{box-sizing:border-box;max-width:480px;margin:0 auto;padding:15vh 25px 40px}
.boot-failure h1{font-size:22px;line-height:1.3;color:#20362a;margin:0 0 12px}
.boot-failure p{font-size:14px;line-height:1.7;color:#617564}
.boot-failure a{display:inline-flex;margin-top:15px;min-height:44px;align-items:center;padding:0 20px;border-radius:10px;background:#83b835;color:#172820;font-weight:700;text-decoration:none}
</style></head><body>
<div id="root"></div>
<script>
(function(){
  function showFailure(){
    if(document.documentElement.dataset.jobdeskBooted==='true')return;
    var root=document.getElementById('root');
    if(!root || root.childElementCount) return;
    var panel=document.createElement('main');
    panel.className='boot-failure';
    panel.setAttribute('role','alert');
    var heading=document.createElement('h1');
    heading.textContent='Jobdesk could not start.';
    var body=document.createElement('p');
    body.textContent='The application files could not be loaded. Please reload the page to try again.';
    var link=document.createElement('a');
    link.href=location.href;
    link.textContent='Reload Jobdesk';
    panel.append(heading,body,link);
    root.appendChild(panel);
  }
  window.showJobdeskBootFailure=showFailure;
  setTimeout(showFailure,12000);
})();
</script>
<script type="module" src="/frontend/main.tsx"></script>
<script>
/* Legacy GitHub Pages branch publisher serves this uncompiled HTML.
   Load the prebuilt Vite bundle when the original TSX module is still present.
   Compiled Vite HTML rewrites the entry to /assets/... and skips this path. */
(function () {
  var entry = Array.from(document.querySelectorAll('script[type="module"][src]')).find(function (el) {
    return el.getAttribute('src') === '/frontend/' + 'main.tsx';
  });
  if (!entry) return;
  var base = '/jobdesk-supabase/';
  var favicon = document.querySelector('link[rel="icon"]');
  if (favicon) favicon.href = base + 'icon.svg?v=211';
  var style = document.createElement('link');
  style.rel = 'stylesheet';
  style.href = base + 'assets/jobdesk-compiled.css?v=300-professional-f37fb89';
  document.head.appendChild(style);
  var bundle = document.createElement('script');
  bundle.type = 'module';
  bundle.src = base + 'assets/jobdesk-compiled.js?v=300-professional-f37fb89';
  bundle.onerror = function () {
    if(typeof window.showJobdeskBootFailure==='function') window.showJobdeskBootFailure();
  };
  document.head.appendChild(bundle);
})();
</script>
</body></html>
