name: Verify Jobdesk source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed files and source paths
        run: |
          git ls-files --error-unmatch index.html frontend/main.tsx app/page.tsx app/globals.css api.ts server.mjs
          npm run verify:source
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build backend and frontend
        run: npm run build
      - name: Verify build output
        run: |
          node --check server.mjs
          node --check api.mjs
          node --check lib/database.mjs
          test -f dist/index.html
          test -d dist/assets
      - name: Verify GitHub Pages production asset paths
        run: |
          npm run build:pages
          grep -q '/jobdesk-supabase/assets/' dist/index.html
          if grep -q '/frontend/main.tsx' dist/index.html; then echo 'Raw TSX in Pages bundle'; exit 1; fi
      - name: Offline repository tests
        run: npm run test:offline
# No production Supabase credentials are used by CI.
