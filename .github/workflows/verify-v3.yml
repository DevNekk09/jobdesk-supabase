name: Jobdesk V3 verification
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/verify-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:source
      - run: npm run build
      - run: npm run test:offline
        if: always()
      - run: npx playwright install --with-deps chromium
        if: always()
      - run: npm run test:e2e
        if: always()
