name: Generate reproducible v2 lockfile
on:
  push:
    branches: [release/v2.0-secure-team-reliability]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0-secure-team-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if needed
        run: |
          if ! git diff --quiet -- package-lock.json || ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(v2): pin dependency tree for npm ci"
            git push origin HEAD:release/v2.0-secure-team-reliability
          fi
