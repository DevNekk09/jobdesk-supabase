name: Build Jobdesk precompiled assets for GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobdesk-precompiled-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate source and offline regressions before publishing
        run: |
          npm run verify:source
          npm run build
          npm run test:offline
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Gate publication on desktop and mobile regression tests
        run: npm run test:e2e
      - name: Build frontend with GitHub Pages base path
        run: npm run build:pages
      - name: Verify compiled files (not raw .tsx source)
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/frontend/main.tsx' dist/index.html; then echo 'Uncompiled TSX entry in output'; exit 1; fi
          grep -q '/jobdesk-supabase/assets/' dist/index.html
      - name: Sync precompiled fallback for legacy branch Pages
        run: |
          mkdir -p assets
          cp dist/assets/*.js assets/jobdesk-compiled.js
          cp dist/assets/*.css assets/jobdesk-compiled.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jobdesk-compiled.js assets/jobdesk-compiled.css
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): publish compiled Jobdesk bundle [skip ci]"
            git push origin HEAD:main
          fi
# Branch-based GitHub Pages automatically publishes main via Jekyll.
# Do not run actions/deploy-pages as well: two publishers compete for the same site.
# If the repository switches Pages Source to GitHub Actions, re-enable the
# upload-pages-artifact/deploy-pages jobs in one authoritative workflow.
