name: Deploy Jobdesk frontend preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend with GitHub Pages base path
        run: npm run build:pages
      - name: Verify compiled files (not raw .tsx source)
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/frontend/main.tsx' dist/index.html; then echo 'Uncompiled TSX entry in output'; exit 1; fi
          grep -q '/jobdesk-supabase/assets/' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
